<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>Adrik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one calm card, the decision first; everything else below it, quiet. */
:root{
  --bg:#f6f3ea; --ink:#17251f; --muted:#5f6d66; --line:#d9d3c3;
  --green:#0f3d2e; --green-2:#1c5a44; --gold:#b8862b; --gold-soft:#f1e5c6;
  --card:#ffffff; --warn:#8a3b1e;
  --display:"Fraunces",Georgia,serif; --arabic:"Amiri","Scheherazade New",serif; --body:"IBM Plex Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1a15; --ink:#efe9da; --muted:#9aa8a1; --line:#24352e; --green:#0f3d2e; --green-2:#2a6e55; --gold:#d6a243; --gold-soft:#2b2410; --card:#132520; --warn:#e08a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1a15; --ink:#efe9da; --muted:#9aa8a1; --line:#24352e; --green:#0f3d2e; --green-2:#2a6e55; --gold:#d6a243; --gold-soft:#2b2410; --card:#132520; --warn:#e08a63; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:baseline;justify-content:space-between;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em}
.brand span{font-family:var(--arabic);font-size:22px;margin-inline-start:8px;color:var(--gold)}
.date{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.prayer{display:flex;align-items:baseline;gap:12px;margin:10px 0 14px}
.prayer h1{font-family:var(--display);font-weight:500;font-size:34px;margin:0;text-wrap:balance}
.prayer .ar{font-family:var(--arabic);font-size:30px;color:var(--gold);line-height:1}
.prayer .adhan{margin-inline-start:auto;font-size:13px;color:var(--muted);text-align:end}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 20px 16px;box-shadow:0 10px 30px rgba(15,61,46,.08)}
.card .m{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;margin:0 0 2px;text-wrap:balance}
.card .sub{color:var(--muted);font-size:14px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 6px}
.hero .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero .v{font-family:var(--display);font-size:32px;white-space:nowrap;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;margin-top:4px}
.hero .v.leave{color:var(--gold)}
.trust{font-size:12.5px;color:var(--muted);margin-top:12px;display:flex;gap:6px;align-items:center}
.trust i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block}
.note{margin:14px 0 0;padding:12px 14px;background:var(--gold-soft);border-radius:12px;font-size:14.5px}
.note.warn{color:var(--warn)}
.missed{margin:0 0 12px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--warn);font-size:14.5px}
.btns{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}
.go{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--green-2);color:#fff;text-decoration:none;font-weight:600;font-size:17px;border-radius:14px;padding:16px;border:0}
.go:focus-visible,.ghost:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:0 16px;font:inherit;font-weight:500}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{background:transparent;border:0;padding:8px 14px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:var(--gold-soft)}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:600}
.alt{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.alt li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.alt .n{font-weight:600}
.alt .d{color:var(--muted);font-size:13px}
.alt .t{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;text-align:end}
.alt .t small{display:block;font-family:var(--body);font-size:12px;color:var(--muted)}
.alt li.miss{opacity:.65}
.foot{margin-top:22px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot button{background:none;border:0;color:var(--green-2);font:inherit;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline}
.skeleton{color:var(--muted)}
.topr{display:flex;align-items:center;gap:12px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{background:transparent;border:0;padding:4px 10px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--green);color:#fff}
.lang button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
:root[lang="ar"]{--body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;--display:"IBM Plex Sans Arabic","Fraunces",Georgia,serif}
:root[lang="ar"] .date,:root[lang="ar"] .hero .k,:root[lang="ar"] h2{letter-spacing:0;text-transform:none}
:root[lang="ar"] .prayer .ar{font-family:var(--display);font-size:22px}
:root[lang="ar"] .hero .v,:root[lang="ar"] .alt .t{direction:ltr;unicode-bidi:isolate}
:root[dir="rtl"] .hero .v,:root[dir="rtl"] .alt .t{text-align:right}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .25s}.card.loading{opacity:.55}}
@media (min-width:640px){body{max-width:520px;margin:0 auto}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Adrik<span>أدرك</span></div>
  <div class="topr">
    <div class="date" id="date">—</div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ar" aria-pressed="false" lang="ar">عربي</button>
    </div>
  </div>
</header>

<div class="prayer">
  <h1 id="pName" data-i18n="finding">Finding your jama'ah</h1>
  <div class="ar" id="pAr"></div>
  <div class="adhan" id="pAdhan"></div>
</div>

<div class="missed" id="missed" hidden></div>
<section class="card loading" id="card" aria-live="polite">
  <p class="m" id="mName" data-i18n="locating">Locating you…</p>
  <div class="sub" id="mSub" data-i18n="locatingSub">Nearby mosques and today's iqama times.</div>
  <div class="hero">
    <div><div class="k" id="kIqama">Iqama</div><div class="v" id="iqama">—</div></div>
    <div><div class="k" id="kLeave">Leave by</div><div class="v leave" id="leave">—</div></div>
  </div>
  <div class="trust" id="trust" hidden><i></i><span id="trustText"></span></div>
  <div class="note" id="note" hidden></div>
  <div class="btns">
    <a class="go" id="go" href="#" target="_blank" rel="noopener" aria-disabled="true" data-i18n="go">Go — open in Google Maps</a>
    <button class="ghost" id="refresh" type="button" data-i18n="refresh">Refresh</button>
  </div>
</section>

<div class="ctrl">
  <div class="seg" role="group" aria-label="Travel mode" id="modes">
    <button type="button" data-mode="driving" aria-pressed="true" data-i18n="driving">Driving</button>
    <button type="button" data-mode="walking" aria-pressed="false" data-i18n="walking">Walking</button>
    <button type="button" data-mode="bicycling" aria-pressed="false" data-i18n="bicycling">Bike</button>
    <button type="button" data-mode="transit" aria-pressed="false" data-i18n="transit">Transit</button>
  </div>
  <button class="chip" id="wudu" type="button" aria-pressed="false" data-i18n="wudu">I have wudu</button>
</div>

<h2 data-i18n="others">Other jama'ahs you can reach</h2>
<ul class="alt" id="alts"><li class="skeleton">—</li></ul>

<div class="foot">
  <span id="meta" data-i18n="proto">Prototype · iqama data from mosque websites</span>
  <button type="button" id="demo" data-i18n="demo">Use demo location (Mississauga)</button>
</div>

<script>
const API = "https://fbowvnwytutltsdnjcxb.supabase.co/functions/v1/guide";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZib3d2bnd5dHV0bHRzZG5qY3hiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MzIzNDEsImV4cCI6MjEwODUwODM0MX0.nLpuv5rDvdka8tfuZ3Ic_T1SdceNtPDTzfhkg6NEYVc";
const DEMO = {lat:43.5728,lng:-79.6914};
const PRAYER = {
  en: {fajr:"Fajr",dhuhr:"Dhuhr",asr:"Asr",maghrib:"Maghrib",isha:"Isha"},
  ar: {fajr:"الفجر",dhuhr:"الظهر",asr:"العصر",maghrib:"المغرب",isha:"العشاء"},
};
const T = {
  en: {
    finding:"Finding your jama'ah", locating:"Locating you…", locatingSub:"Nearby mosques and today's iqama times.",
    go:"Go — open in Google Maps", refresh:"Refresh", driving:"Driving", walking:"Walking", bicycling:"Bike", transit:"Transit",
    wudu:"I have wudu", others:"Other jama'ahs you can reach", proto:"Prototype · iqama data from mosque websites", demo:"Use demo location (Mississauga)",
    iqama:"Iqama", leaveBy:"Leave by", tomorrow:"tomorrow", now:"now",
    noLoc:"Location unavailable", noLocSub:"Allow location, or use the demo location below.", noServer:"Couldn't reach the server",
    noJamaah:"No jama'ah to catch right now", nearby:(c,w)=>`${c} mosques nearby · ${w} with iqama data`,
    adhanNow:(a,n)=>`Adhan ${a}<br>now ${n}`,
    missed:(p)=>`${p} jama'ah has passed at every mosque nearby — pray ${p} where you are.`,
    sub:(km,min,m,j)=>`${km} km · ${min} min ${m}${j?" · "+j:""}`,
    modeWord:{driving:"driving",walking:"walking",bicycling:"by bike",transit:"by transit"},
    fromTable:"From the mosque's timetable", fromRule:"From the mosque's standing rule", estimated:" · travel time estimated", live:" · live traffic",
    noteWait:(p,i,m,l)=>`${p} iqama ${i} at ${m}. No need to leave yet — leave by ${l}.`,
    noteGo:(m,s)=>s<=1?`Leave now for ${m}. You'll arrive right at iqama.`:`Leave now for ${m}. You'll arrive about ${s} min before iqama.`,
    noteLate:(s,m)=>`You'd arrive about ${s} min after iqama at ${m} — you can still join the jama'ah in progress.`,
    noData:(c)=>`${c} nearby mosques have no iqama data yet.`, noOther:"No other jama'ah reachable for this prayer.",
    altD:(km,min,l)=>`${km} km · ${min} min · leave by ${l}`, spare:(s)=>`${s} min to spare`, late:(s)=>`${s} min late`,
    meta:(ap,c,w,d)=>`${ap?"Approximate location (from your network) · ":""}${c} mosques within 5 km · ${w} with iqama data · ${d}`,
  },
  ar: {
    finding:"نبحث عن أقرب جماعة", locating:"نحدد موقعك…", locatingSub:"المساجد القريبة وأوقات الإقامة اليوم.",
    go:"انطلق — خرائط Google", refresh:"تحديث", driving:"سيارة", walking:"مشياً", bicycling:"دراجة", transit:"مواصلات",
    wudu:"أنا على وضوء", others:"جماعات أخرى يمكنك إدراكها", proto:"نسخة تجريبية · أوقات الإقامة من مواقع المساجد", demo:"استخدم موقعاً تجريبياً (ميسيساغا)",
    iqama:"الإقامة", leaveBy:"انطلق قبل", tomorrow:"غداً", now:"الآن",
    noLoc:"تعذّر تحديد الموقع", noLocSub:"اسمح بالوصول إلى الموقع، أو استخدم الموقع التجريبي بالأسفل.", noServer:"تعذّر الاتصال بالخادم",
    noJamaah:"لا توجد جماعة يمكن إدراكها الآن", nearby:(c,w)=>`${c} مسجداً قريباً · ${w} لديها أوقات إقامة`,
    adhanNow:(a,n)=>`الأذان ${a}<br>الآن ${n}`,
    missed:(p)=>`فاتت جماعة ${p} في كل المساجد القريبة — صلِّ ${p} حيث أنت.`,
    sub:(km,min,m,j)=>`${km} كم · ${min} دقيقة ${m}${j?" · "+j:""}`,
    modeWord:{driving:"بالسيارة",walking:"مشياً",bicycling:"بالدراجة",transit:"بالمواصلات"},
    fromTable:"من جدول المسجد", fromRule:"من قاعدة المسجد الثابتة", estimated:" · مدة الطريق تقديرية", live:" · حركة المرور مباشرة",
    noteWait:(p,i,m,l)=>`إقامة ${p} ${i} في ${m}. لا داعي للخروج الآن — انطلق قبل ${l}.`,
    noteGo:(m,s)=>s<=1?`انطلق الآن إلى ${m}. ستصل مع الإقامة تماماً.`:`انطلق الآن إلى ${m}. ستصل قبل الإقامة بنحو ${s} دقيقة.`,
    noteLate:(s,m)=>`ستصل بعد الإقامة بنحو ${s} دقيقة في ${m} — ما زال بإمكانك اللحاق بالجماعة.`,
    noData:(c)=>`${c} مسجداً قريباً بلا أوقات إقامة بعد.`, noOther:"لا توجد جماعة أخرى يمكن إدراكها لهذه الصلاة.",
    altD:(km,min,l)=>`${km} كم · ${min} دقيقة · انطلق قبل ${l}`, spare:(s)=>`متسع ${s} دقيقة`, late:(s)=>`متأخر ${s} دقيقة`,
    meta:(ap,c,w,d)=>`${ap?"موقع تقريبي (من شبكتك) · ":""}${c} مسجداً ضمن 5 كم · ${w} لديها أوقات إقامة · ${d}`,
  },
};
let pos = null, mode = "driving", wudu = false, lang = "en", last = null;
const $ = (id) => document.getElementById(id);

try { mode = localStorage.getItem("adrik.mode") || mode; wudu = localStorage.getItem("adrik.wudu") === "1"; lang = localStorage.getItem("adrik.lang") || ((navigator.language || "").startsWith("ar") ? "ar" : "en"); } catch {}
if (!["driving","walking","bicycling","transit"].includes(mode)) mode = "driving";
if (!["en","ar"].includes(lang)) lang = "en";
document.querySelectorAll("#modes button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
$("wudu").setAttribute("aria-pressed", String(wudu));

const t = () => T[lang];
// Times come from the engine as "6:15 am" / "6:15 am tomorrow".
const tm = (s) => { if (!s) return s; s = s.replace(" tomorrow", ""); return lang === "ar" ? s.replace(" am", " ص").replace(" pm", " م") : s; };
const pname = (p) => PRAYER[lang][p] || p;
const iso = (x) => "\u2068" + x + "\u2069"; // keep Latin names intact inside Arabic sentences

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = t()[el.dataset.i18n]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("date").textContent = new Intl.DateTimeFormat(lang === "ar" ? "ar-u-nu-latn" : "en-CA", {weekday:"short",month:"short",day:"numeric"}).format(new Date());
  $("kIqama").textContent = t().iqama; $("kLeave").textContent = t().leaveBy;
  if (last) render(last);
}

let approx = false;
async function locate() {
  const gps = await new Promise((res) => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({lat:p.coords.latitude,lng:p.coords.longitude}), () => res(null), {enableHighAccuracy:true, timeout:8000, maximumAge:60000});
  });
  if (gps) { approx = false; return gps; }
  try {
    const r = await fetch("https://ipapi.co/json/"); const j = await r.json();
    if (j.latitude && j.longitude) { approx = true; return {lat:j.latitude, lng:j.longitude}; }
  } catch {}
  return null;
}

let seq = 0;
async function run() {
  const my = ++seq;
  $("card").classList.add("loading");
  if (!pos) { const p = await locate(); if (my !== seq) return; pos = p; }
  if (!pos) { $("mName").textContent = t().noLoc; $("mSub").textContent = t().noLocSub; $("card").classList.remove("loading"); return; }
  try {
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+ANON}, body: JSON.stringify({lat:pos.lat, lng:pos.lng, mode, has_wudu:wudu})});
    const d = await r.json();
    if (my !== seq) return;
    if (d.error) throw new Error(d.error);
    last = d; render(d);
  } catch (e) {
    $("mName").textContent = t().noServer; $("mSub").textContent = String(e.message || e);
  }
  $("card").classList.remove("loading");
}

function render(d) {
  const L = t(), tmr = d.day === "tomorrow";
  $("pName").textContent = pname(d.prayer);
  $("pAr").textContent = lang === "en" ? PRAYER.ar[d.prayer] || "" : PRAYER.en[d.prayer] || "";
  const missed = $("missed");
  missed.hidden = !d.missed;
  if (d.missed) missed.textContent = L.missed(pname(d.missed));
  $("pAdhan").innerHTML = L.adhanNow(tm(d.adhan) + (tmr ? " " + L.tomorrow : ""), tm(d.now));
  const rec = d.recommendation;
  const go = $("go");
  $("kIqama").textContent = L.iqama + (tmr ? " · " + L.tomorrow : "");
  $("kLeave").textContent = L.leaveBy + (tmr ? " · " + L.tomorrow : "");
  const note = $("note");
  if (!rec) {
    $("mName").textContent = L.noJamaah;
    $("mSub").textContent = L.nearby(d.candidates, d.with_data);
    $("iqama").textContent = "—"; $("leave").textContent = "—";
    go.setAttribute("aria-disabled","true"); go.href = "#";
    $("trust").hidden = true; note.hidden = true;
  } else {
    $("mName").textContent = rec.mosque;
    $("mSub").textContent = L.sub(rec.distance_km, rec.travel_min, L.modeWord[rec.mode] || rec.mode, rec.jamaah !== "main" ? rec.jamaah : "");
    $("iqama").textContent = tm(rec.iqama);
    $("leave").textContent = rec.feasible ? tm(rec.leave_by) : L.now;
    go.href = rec.maps_url; go.removeAttribute("aria-disabled");
    $("trust").hidden = false;
    $("trustText").textContent = (rec.data === "table" ? L.fromTable : L.fromRule) + (d.eta_source === "estimate" ? L.estimated : L.live);
    const iq = tm(rec.iqama) + (tmr ? " " + L.tomorrow : ""), lb = tm(rec.leave_by) + (tmr ? " " + L.tomorrow : "");
    const mn = iso(rec.mosque);
    note.textContent = !rec.feasible ? L.noteLate(-rec.slack_min, mn) : rec.slack_min > 20 ? L.noteWait(pname(d.prayer), iso(iq), mn, iso(lb)) : L.noteGo(mn, rec.slack_min);
    note.hidden = false;
    note.classList.toggle("warn", !rec.feasible);
  }
  const alts = $("alts");
  alts.innerHTML = "";
  if (!d.alternatives?.length) { const li = document.createElement("li"); li.className = "skeleton"; li.textContent = d.without_data ? L.noData(d.without_data) : L.noOther; alts.appendChild(li); }
  for (const a of d.alternatives || []) {
    const li = document.createElement("li");
    li.className = a.feasible ? "" : "miss";
    li.innerHTML = `<div><div class="n"></div><div class="d"></div></div><div class="t"><span></span><small></small></div>`;
    li.querySelector(".n").textContent = a.mosque;
    li.querySelector(".d").textContent = L.altD(a.distance_km, a.travel_min, tm(a.leave_by));
    li.querySelector(".t span").textContent = tm(a.iqama);
    li.querySelector(".t small").textContent = a.feasible ? L.spare(a.slack_min) : L.late(-a.slack_min);
    li.addEventListener("click", () => window.open(a.maps_url, "_blank", "noopener"));
    alts.appendChild(li);
  }
  $("meta").textContent = L.meta(approx, d.candidates, d.with_data, d.date);
}

document.querySelectorAll("#modes button").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode; try { localStorage.setItem("adrik.mode", mode); } catch {}
  document.querySelectorAll("#modes button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  run();
}));
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("adrik.lang", lang); } catch {}
  applyLang();
}));
$("wudu").addEventListener("click", () => { wudu = !wudu; $("wudu").setAttribute("aria-pressed", String(wudu)); try { localStorage.setItem("adrik.wudu", wudu ? "1" : "0"); } catch {} run(); });
$("refresh").addEventListener("click", () => { pos = null; run(); });
$("demo").addEventListener("click", () => { pos = DEMO; approx = false; run(); });
$("go").addEventListener("click", (e) => { if ($("go").getAttribute("aria-disabled") === "true") e.preventDefault(); });
applyLang();
run();
setInterval(() => { if (pos) run(); }, 5 * 60 * 1000);
</script>
</body>
</html>
